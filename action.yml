# Set up jup from project pins. See https://jup.unjs.io/actions.
name: setup-jup
description: Install the project's pinned Node.js runtime and package managers with jup.
author: unjs

branding:
  icon: package
  color: yellow

inputs:
  node-version:
    description: >-
      A Node.js version, range, or tag. Project pins take priority. An empty
      value uses jup's default.
    required: false
    default: lts
  jup-version:
    description: The jup npm version to install. Use an exact version for repeatable jobs.
    required: false
    default: latest
  package-managers:
    description: >-
      Space-separated tools to shim. `auto` shims every tool. `none` shims no
      package manager. Node.js is always shimmed.
    required: false
    default: auto
  cache:
    description: Save and restore `JUP_HOME`, jup's own store, between runs.
    required: false
    default: "true"
  cache-dependencies:
    description: Save and restore the pinned package manager's own store.
    required: false
    default: "true"
  install:
    description: >-
      Install dependencies with the pinned manager. `false` skips this. Any
      other value except `true` is passed to the manager.
    required: false
    default: "true"
  working-directory:
    description: The directory whose project pins are read.
    required: false
    default: "."

outputs:
  node-version:
    description: The selected Node.js version.
    value: ${{ steps.node.outputs.version }}
  node-path:
    description: Absolute path of the `node` shim.
    value: ${{ steps.node.outputs.path }}
  package-manager:
    description: The pinned package manager, or an empty value.
    value: ${{ steps.project.outputs.package-manager }}
  bin-directory:
    description: The shim directory added to `PATH`.
    value: ${{ steps.paths.outputs.bin }}
  jup-home:
    description: The `JUP_HOME` value used by later steps.
    value: ${{ steps.paths.outputs.home }}

runs:
  using: composite
  steps:
    # Export the store for later shims, but keep shims outside the cached store
    # so stale absolute interpreters cannot be restored (§10.2). Add the empty
    # shim directory to `PATH` before `enable` checks it, and export its location
    # so later jup commands agree (§10.5).
    #
    # Both directories derive from `RUNNER_TEMP`: Windows wrappers use paths
    # relative to the shim directory and cannot cross drives (§10.4, §10.9).
    - name: Resolve jup paths
      id: paths
      shell: bash
      run: |
        set -euo pipefail

        # jup needs the runner's Node.js only to start.
        if ! command -v node >/dev/null 2>&1; then
          echo "::error::setup-jup needs Node.js on PATH. Install it first or run actions/setup-node."
          exit 1
        fi

        temp="${RUNNER_TEMP//\\//}"
        # Preserve caller-supplied locations; otherwise use runner-local defaults.
        home="${JUP_HOME:-$temp/jup-home}"
        bin="${JUP_SHIM_DIRECTORY:-$temp/jup-bin}"
        info="$temp/jup-info.json"
        mkdir -p "$home" "$bin"
        # Export only jup's public settings; keep the report path step-local.
        {
          echo "JUP_HOME=$home"
          echo "JUP_SHIM_DIRECTORY=$bin"
        } >> "$GITHUB_ENV"
        {
          echo "home=$home"
          echo "bin=$bin"
          echo "info=$info"
        } >> "$GITHUB_OUTPUT"
        # All installed commands, including jup itself, use this single entry.
        echo "$bin" >> "$GITHUB_PATH"

    # Bootstrap with the runner's node, then let `self-install` own the permanent
    # copy and the `jup`/`corepack` shims (§09.12). `--force` safely replaces an
    # existing `corepack` shim (§10.9). Reinstall every run because the generated
    # CLI entry embeds the runner's node (§10.2).
    #
    # The payload comes straight from the registry rather than through `npx`.
    # `self-install` copies whichever bytes are already running, so npm was only
    # ever delivering them — and it charged six seconds on Linux and nineteen on
    # Windows to run a full install of a zero-dependency 200 KB package into its
    # own `_npx` tree. Two requests and a `tar` replace that, checking the same
    # sha512 from the same manifest npm would have read.
    #
    # `npx` stays as the fallback for everything one request cannot answer: a
    # range, a mirror, a private registry whose credentials live in npm's
    # configuration and not here. Every such case falls back rather than failing,
    # so the fast path never narrows what `jup-version` accepts.
    #
    # Both routes run outside the project: `npm exec` loads the nearest manifest
    # and refuses with `EBADDEVENGINES` when `devEngines.packageManager` names
    # another tool — which is every project this action exists to set up.
    # `self-install` reads no project, so the directory it runs in carries no
    # other meaning.
    - name: Install jup
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        JUP_SPEC: ${{ inputs.jup-version }}
        BIN_DIR: ${{ steps.paths.outputs.bin }}
      run: |
        set -euo pipefail

        # npm's own environment spelling, in both of npm's cases. A registry
        # configured only in `.npmrc` is not read here; it lands on the fallback.
        registry="${npm_config_registry:-${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}}"

        # A dist-tag or an exact version is one path segment on the registry, and
        # this charset is what keeps it one: no slash, no leading dot, nothing
        # that could reach another path or another host. A range, a URL or a
        # local path fails the test and takes the fallback.
        entry=""
        case "$JUP_SPEC" in
          "" | .* | *[!A-Za-z0-9._-]*) ;;
          *) entry="$JUP_SPEC" ;;
        esac

        # A directory of our own, so the fetch and the extraction can name bare
        # files and keep MSYS out of the way on the Windows runner.
        work="$(mktemp -d)"
        cd "$work"

        # Stays empty unless every step below succeeded; that is the fallback's
        # only cue. `-f` makes 404 and 401 alike a non-zero exit, which is how a
        # range or a registry that wants credentials arrives here.
        payload=""
        if [ -n "$entry" ] && curl -fsL "${registry%/}/jup/$entry" -o manifest.json; then
          # Both fields or neither: a manifest without `dist.integrity` is one
          # this step cannot check, and an unchecked tarball is not installable.
          spec="$(node -e '
            const { dist } = require("./manifest.json");
            if (typeof dist?.tarball === "string" && typeof dist?.integrity === "string") {
              process.stdout.write(`${dist.tarball} ${dist.integrity}`);
            }
          ')"
          url="${spec%% *}"
          integrity="${spec#* }"
          if [ -n "$url" ] && [ -n "$integrity" ] && curl -fsSL "$url" -o jup.tgz; then
            # The check npm would have made, against the manifest npm would have
            # read. A mismatch is fatal and never a fallback: bytes that fail
            # here are not bytes to hand to another installer.
            node -e '
              const { createHash } = require("node:crypto");
              const { readFileSync } = require("node:fs");
              const [expected] = process.argv.slice(1);
              const actual = `sha512-${createHash("sha512").update(readFileSync("jup.tgz")).digest("base64")}`;
              if (actual !== expected) {
                throw new Error(`jup tarball integrity mismatch: got ${actual}, expected ${expected}`);
              }
            ' "$integrity"
            # Use npx if tar is missing or cannot unpack the verified file.
            if tar -xzf jup.tgz; then payload="$work/package"; fi
          fi
        fi

        if [ -n "$payload" ]; then
          node "$payload/bin/jup.mjs" self-install --install-directory "$BIN_DIR" --force
        else
          # Said in our own words, because the registry probe above is quiet:
          # reaching npm is an expected outcome, not a failure to debug.
          echo "Installing jup@$JUP_SPEC through npm; the registry did not answer that spec directly."
          # `--yes` prevents prompting.
          npx --yes "jup@$JUP_SPEC" self-install --install-directory "$BIN_DIR" --force
        fi
        jup --version

    # One `info --json`, and the only one. It runs before any shim exists, so it
    # uses the runner's own node (§10.2), and before the store is restored,
    # because nothing it reports depends on the store's contents. Two answers
    # come out of it: what the cache key should be, and whether this project
    # pins a manager at all.
    - name: Read the project
      id: project
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SETUP_JUP_INFO: ${{ steps.paths.outputs.info }}
      run: |
        set -euo pipefail
        jup info --json > "$SETUP_JUP_INFO"
        node -e '
          const { createHash } = require("node:crypto");
          const { readFileSync } = require("node:fs");
          const report = require(process.env.SETUP_JUP_INFO);

          // §09.9 - `inputs` is what a correct key is built from, and it arrived
          // in jup 0.5.2. Refusing here beats falling back to a guessed file
          // list, which is the bug this step exists to remove: a wrong key is
          // not an error anyone sees, it is just a cache that never hits.
          if (!Array.isArray(report.inputs)) {
            throw new Error(
              "setup-jup needs jup 0.5.2 or newer for the project inputs in `info --json`; " +
                "raise the jup-version input, or pin an older ref of this action.",
            );
          }

          // Every file §03.1 would consult, present or not. Absolute paths differ
          // between runners and must not enter the digest, so only the kind of
          // each entry, the tool it speaks for, and its contents do. An absent
          // candidate contributes a marker of its own, which is what makes
          // committing an .nvmrc or a .corepack.env move the key.
          const digest = createHash("sha256");
          for (const input of report.inputs) {
            digest.update(`${input.kind}\0${input.tool ?? ""}\0`);
            let mark = "absent";
            if (input.present) {
              try {
                mark = createHash("sha256").update(readFileSync(input.path)).digest("hex");
              } catch {
                mark = "unreadable";
              }
            }
            digest.update(`${mark}\n`);
          }

          const name = report.project.status === "found" ? report.project.name ?? "" : "";
          process.stdout.write(`project-key=${digest.digest("hex")}\npackage-manager=${name}\n`);
        ' >> "$GITHUB_OUTPUT"

    # `JUP_HOME` contains trusted executables: bind cache reuse to the host, jup,
    # and runtime request, and pin the cache action by digest (docs/4.ci.md, §07).
    #
    # The last segment is jup's own answer for which files decide a run (§09.9),
    # not a guess at their names: a workspace root above `working-directory` is
    # counted, the version file is whatever §02's table calls it, and a candidate
    # that is merely absent still moves the key on the day it appears.
    #
    # Those files are hashed whole, so an unrelated dependency bump in a manifest
    # still writes a new entry. That is churn and not a re-download: `restore-keys`
    # falls back to the newest key sharing the prefix, and the store it restores
    # is already complete. Narrowing the key to the pin-bearing fields would put
    # knowledge of jup's manifest fields back into this file, which is the
    # coupling the rest of this step exists to remove.
    - name: Cache jup's store
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # Do not restore jup's runner-specific absolute interpreter (§10.2).
        # `self-install` checks the source digest, so it would not repair a stale
        # cached copy; npx already downloads the source each run (§09.12).
        path: |
          ${{ steps.paths.outputs.home }}
          !${{ steps.paths.outputs.home }}/self
        key: setup-jup-${{ runner.os }}-${{ runner.arch }}-${{ inputs.jup-version }}-${{ inputs.node-version }}-${{ steps.project.outputs.project-key }}
        restore-keys: |
          setup-jup-${{ runner.os }}-${{ runner.arch }}-${{ inputs.jup-version }}-${{ inputs.node-version }}-

    # Enable `node` and all requested managers together so every stub embeds the
    # runner's stable interpreter (§10.2). `none` still enables `node`; `auto` is
    # §10.7's `--all`, which reaches the opt-in runtimes a bare `enable` leaves
    # alone. The table is expanded inside jup, so no list of names crosses this
    # file and a new entry needs no edit here.
    - name: Enable shims
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BIN_DIR: ${{ steps.paths.outputs.bin }}
        NAMES: ${{ inputs.package-managers }}
      run: |
        set -euo pipefail
        case "$NAMES" in
          auto) jup enable --install-directory "$BIN_DIR" --all ;;
          none) jup enable --install-directory "$BIN_DIR" node ;;
          # §10.7 deduplicates names, including a caller-supplied `node`.
          # shellcheck disable=SC2086
          *)    jup enable --install-directory "$BIN_DIR" $NAMES node ;;
        esac

    # Record an explicit request as the global default (§09.3); project runtime
    # pins still win (§04). Ask the shim so the output reports the resolved winner.
    - name: Set up Node.js
      id: node
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REQUESTED: ${{ inputs.node-version }}
        BIN_DIR: ${{ steps.paths.outputs.bin }}
      run: |
        set -euo pipefail

        case "$REQUESTED" in
          "")                  spec="" ;;
          node|current|latest) spec="node@latest" ;;
          lts)                 spec="node@lts" ;;
          lts/*)
            echo "::notice::jup answers a bare 'lts' tag; reading '$REQUESTED' as 'lts'"
            spec="node@lts" ;;
          *)                   spec="node@${REQUESTED#v}" ;;
        esac

        if [ -n "$spec" ]; then jup cache install -g "$spec"; fi

        # Resolve, verify, install, and report the runtime through the shim.
        version="$(node --version)"

        {
          echo "version=${version#v}"
          # POSIX and Windows shims both resolve at this extensionless path (§10.4).
          echo "path=$BIN_DIR/node"
        } >> "$GITHUB_OUTPUT"

    # Warm the project-pinned manager; no project pin is valid (§09.2). The name
    # was read before any shim existed, so nothing here has to run `node` again.
    - name: Warm the pinned package manager
      if: steps.project.outputs.package-manager != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        jup cache install

    # Cache manager packages separately from jup's program store.
    #
    # §09.9 owns every part of this that used to be spelled here: which command
    # each manager answers with, Yarn Classic printing `undefined` for Berry's
    # setting, and reading the last line past a manager's own notices. The
    # contract is one absolute path or nothing, always exit 0, so an optional
    # cache step cannot fail the job -- and the warm step above is what makes it
    # answer, because the probe runs only what the store already holds.
    - name: Locate the package manager store
      id: store
      if: inputs.cache-dependencies == 'true' && steps.project.outputs.package-manager != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        echo "dir=$(jup info --store-path)" >> "$GITHUB_OUTPUT"

    - name: Cache the package manager store
      if: steps.store.outputs.dir != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.dir }}
        key: setup-jup-${{ steps.project.outputs.package-manager }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/**/pnpm-lock.yaml', inputs.working-directory), format('{0}/**/yarn.lock', inputs.working-directory), format('{0}/**/package-lock.json', inputs.working-directory), format('{0}/**/bun.lock', inputs.working-directory)) }}
        restore-keys: |
          setup-jup-${{ steps.project.outputs.package-manager }}-${{ runner.os }}-${{ runner.arch }}-

    # Last, so the manager's store is restored before it is read (§09.15). The
    # pin decides the command: `pnpm install`, `yarn install`, `npm install`.
    #
    # A project with no pin skips this, exactly as the warm step above skips its
    # `cache install`: with the input defaulting to `true`, reaching §12.10's
    # project error would mean the default breaking every unpinned repo that
    # only ever wanted a runtime.
    - name: Install dependencies
      if: inputs.install != 'false' && inputs.install != '' && steps.project.outputs.package-manager != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ARGS: ${{ inputs.install }}
      run: |
        set -euo pipefail
        # `true` asks for the bare command; anything else is the manager's argv.
        if [ "$ARGS" = true ]; then ARGS=""; fi
        # shellcheck disable=SC2086
        jup install $ARGS
