# jup's unpublished replacement for `actions/setup-node` + `corepack enable`.
# It installs the project runtime, shims jup's table, and caches jup's store and
# the manager's store. Inputs reach scripts through the environment, never
# expression interpolation; only the §09 command surface and `info --json` are used.
name: setup-jup
description: Install the project's pinned Node.js runtime and package managers with jup.

inputs:
  node-version:
    description: >-
      Version, range or tag for Node.js. Empty (the default) lets the project
      decide: `devEngines.runtime`, then `.nvmrc`, then jup's built-in default.
      `setup-node` spellings are translated — `lts/*` becomes `lts`, `node` and
      `current` become `latest`, and a leading `v` is dropped.
    required: false
    default: ""
  jup-version:
    description: The jup release to install, as an npm spec.
    required: false
    default: latest
  package-managers:
    description: >-
      Package managers to shim, space-separated. `auto` (the default) is every
      entry in jup's table, the opt-in runtimes included. `none` shims no
      manager. `node` is not governed by this input and is always shimmed.
    required: false
    default: auto
  cache:
    description: Save and restore `JUP_HOME` between runs.
    required: false
    default: "true"
  cache-dependencies:
    description: Save and restore the pinned package manager's own store.
    required: false
    default: "true"
  working-directory:
    description: The directory whose project pins are read.
    required: false
    default: "."

outputs:
  node-version:
    description: The exact Node.js version the `node` shim resolves.
    value: ${{ steps.node.outputs.version }}
  node-path:
    description: Absolute path of the `node` shim.
    value: ${{ steps.node.outputs.path }}
  package-manager:
    description: The package manager the project pins, or empty when it pins none.
    value: ${{ steps.project.outputs.package-manager }}
  bin-directory:
    description: The directory prepended to `PATH`, holding every shim.
    value: ${{ steps.paths.outputs.bin }}
  jup-home:
    description: The value of `JUP_HOME` for the rest of the job.
    value: ${{ steps.paths.outputs.home }}

runs:
  using: composite
  steps:
    # Export the store for later shims, but keep shims outside the cached store
    # so stale absolute interpreters cannot be restored (§10.2). Add the empty
    # shim directory to `PATH` before `enable` checks it, and export its location
    # so later jup commands agree (§10.5).
    #
    # Both directories derive from `RUNNER_TEMP`: Windows wrappers use paths
    # relative to the shim directory and cannot cross drives (§10.4, §10.9).
    - id: paths
      shell: bash
      run: |
        set -euo pipefail
        temp="${RUNNER_TEMP//\\//}"
        # Preserve caller-supplied locations; otherwise use runner-local defaults.
        home="${JUP_HOME:-$temp/jup-home}"
        bin="${JUP_SHIM_DIRECTORY:-$temp/jup-bin}"
        info="$temp/jup-info.json"
        mkdir -p "$home" "$bin"
        # Export only jup's public settings; keep the report path step-local.
        {
          echo "JUP_HOME=$home"
          echo "JUP_SHIM_DIRECTORY=$bin"
        } >> "$GITHUB_ENV"
        {
          echo "home=$home"
          echo "bin=$bin"
          echo "info=$info"
        } >> "$GITHUB_OUTPUT"
        # All installed commands, including jup itself, use this single entry.
        echo "$bin" >> "$GITHUB_PATH"

    # `JUP_HOME` contains trusted executables: bind cache reuse to the host, jup,
    # and runtime request, and pin the cache action by digest (docs/3.ci.md, §07).
    - if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # Do not restore jup's runner-specific absolute interpreter (§10.2).
        # `self-install` checks the source digest, so it would not repair a stale
        # cached copy; npx already downloads the source each run (§09.12).
        path: |
          ${{ steps.paths.outputs.home }}
          !${{ steps.paths.outputs.home }}/self
        key: setup-jup-${{ runner.os }}-${{ runner.arch }}-${{ inputs.jup-version }}-${{ inputs.node-version }}-${{ hashFiles(format('{0}/package.json', inputs.working-directory), format('{0}/jup.lock', inputs.working-directory), format('{0}/.nvmrc', inputs.working-directory)) }}
        restore-keys: |
          setup-jup-${{ runner.os }}-${{ runner.arch }}-${{ inputs.jup-version }}-${{ inputs.node-version }}-

    # Bootstrap with the runner's node, then let `self-install` own the permanent
    # copy and the `jup`/`corepack` shims (§09.12). `--yes` prevents prompting;
    # `--force` safely replaces an existing `corepack` shim (§10.9). Reinstall
    # every run because the generated CLI entry embeds the runner's node (§10.2).
    #
    # Run outside the project: `npm exec` loads the nearest manifest and refuses
    # with `EBADDEVENGINES` when `devEngines.packageManager` names another tool —
    # which is every project this action exists to set up. `self-install` reads no
    # project, so the directory it runs in carries no other meaning.
    - shell: bash
      working-directory: ${{ runner.temp }}
      env:
        JUP_SPEC: ${{ inputs.jup-version }}
        BIN_DIR: ${{ steps.paths.outputs.bin }}
      run: |
        set -euo pipefail
        npx --yes "jup@$JUP_SPEC" self-install --install-directory "$BIN_DIR" --force
        jup --version

    # Enable `node` and all requested managers together so every stub embeds the
    # runner's stable interpreter (§10.2). `none` still enables `node`; `auto`
    # reads the full table, including opt-in runtimes, from `info --json` (§10.7).
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BIN_DIR: ${{ steps.paths.outputs.bin }}
        NAMES: ${{ inputs.package-managers }}
        SETUP_JUP_INFO: ${{ steps.paths.outputs.info }}
      run: |
        set -euo pipefail
        # Read the table before `node` becomes an unprovisioned shim.
        case "$NAMES" in
          auto)
            jup info --json > "$SETUP_JUP_INFO"
            names="$(node -e '
              const report = require(process.env.SETUP_JUP_INFO);
              process.stdout.write(report.packageManagers.map((entry) => entry.name).join(" "));
            ')" ;;
          none) names="node" ;;
          # §10.7 deduplicates names, including a caller-supplied `node`.
          *)    names="$NAMES node" ;;
        esac
        # shellcheck disable=SC2086
        jup enable --install-directory "$BIN_DIR" $names

    # Record an explicit request as the global default (§09.3); project runtime
    # pins still win (§04). Ask the shim so the output reports the resolved winner.
    - id: node
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REQUESTED: ${{ inputs.node-version }}
        BIN_DIR: ${{ steps.paths.outputs.bin }}
      run: |
        set -euo pipefail

        case "$REQUESTED" in
          "")                  spec="" ;;
          node|current|latest) spec="node@latest" ;;
          lts)                 spec="node@lts" ;;
          lts/*)
            echo "::notice::jup answers a bare 'lts' tag; reading '$REQUESTED' as 'lts'"
            spec="node@lts" ;;
          *)                   spec="node@${REQUESTED#v}" ;;
        esac

        if [ -n "$spec" ]; then jup install -g "$spec"; fi

        # Resolve, verify, install, and report the runtime through the shim.
        version="$(node --version)"

        {
          echo "version=${version#v}"
          # POSIX and Windows shims both resolve at this extensionless path (§10.4).
          echo "path=$BIN_DIR/node"
        } >> "$GITHUB_OUTPUT"

    # Warm the project-pinned manager; no project pin is valid (§09.2).
    - id: project
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SETUP_JUP_INFO: ${{ steps.paths.outputs.info }}
      run: |
        set -euo pipefail
        jup info --json > "$SETUP_JUP_INFO"
        name="$(node -e '
          const report = require(process.env.SETUP_JUP_INFO);
          process.stdout.write(report.project.status === "found" ? report.project.name ?? "" : "");
        ')"
        echo "package-manager=$name" >> "$GITHUB_OUTPUT"
        if [ -n "$name" ]; then jup install; fi

    # Cache manager packages separately from jup's program store.
    - id: store
      if: inputs.cache-dependencies == 'true' && steps.project.outputs.package-manager != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PM: ${{ steps.project.outputs.package-manager }}
      run: |
        set -euo pipefail
        # Cache discovery is optional; failures must not fail the job.
        dir=""
        case "$PM" in
          pnpm) dir="$(jup pnpm store path --silent | tail -n1 || true)" ;;
          npm)  dir="$(jup npm config get cache | tail -n1 || true)" ;;
          yarn)
            # Berry answers `cacheFolder`; Classic prints `undefined` for it.
            dir="$(jup yarn config get cacheFolder 2>/dev/null | tail -n1 || true)"
            case "$dir" in
              "" | undefined) dir="$(jup yarn cache dir | tail -n1 || true)" ;;
            esac ;;
          bun)  dir="$(jup bun pm cache | tail -n1 || true)" ;;
          # Other tools have no stable store command; skip their optional cache.
          *) ;;
        esac
        if [ "$dir" = undefined ]; then dir=""; fi
        echo "dir=$dir" >> "$GITHUB_OUTPUT"

    - if: steps.store.outputs.dir != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.dir }}
        key: setup-jup-${{ steps.project.outputs.package-manager }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/**/pnpm-lock.yaml', inputs.working-directory), format('{0}/**/yarn.lock', inputs.working-directory), format('{0}/**/package-lock.json', inputs.working-directory), format('{0}/**/bun.lock', inputs.working-directory)) }}
        restore-keys: |
          setup-jup-${{ steps.project.outputs.package-manager }}-${{ runner.os }}-${{ runner.arch }}-
