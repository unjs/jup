# The suite runs on all three platforms because a good half of this spec is
# platform-specific and untested elsewhere: §10.3's Windows wrappers, §10.2's
# POSIX symlinks, §15.13's per-user shim directory (`%LOCALAPPDATA%` /
# `$XDG_BIN_HOME` / `~/Library`), §07's path and mode handling, and §08.5's
# signal semantics, which Windows does not have at all.
#
# `typecheck` and `lint` stay on Linux alone. Neither reads `process.platform`,
# so running them three times answers the same question three times.
name: checks
on: { push: {}, pull_request: {} }
jobs:
  checks:
    runs-on: ${{ matrix.os }}
    # Windows reports but does not block, because it does not pass yet: §08.2's
    # handover calls `runMain` with an absolute path, and on Windows an ESM entry
    # point sends that to the loader as the scheme `d:`
    # (ERR_UNSUPPORTED_ESM_URL_SCHEME). That is a product bug, not a fixture one,
    # and the rest of the Windows column cannot be read until it is fixed. The
    # leg stays visible so the number moves in the open; drop this line when it
    # reaches zero.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      # Every platform reports. A Windows failure must not hide a macOS one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      # Before `setup-node`, which needs `pnpm` on PATH to resolve its cache.
      - run: npm i -fg corepack && corepack enable
      - uses: actions/setup-node@v6
        with: { node-version: lts/*, cache: "pnpm" }
      - run: pnpm install
      - if: runner.os == 'Linux'
        run: pnpm typecheck
      - run: pnpm vitest --coverage
      - if: runner.os == 'Linux'
        run: pnpm run lint
      # - uses: codecov/codecov-action@v5
      #   with: { token: "${{ secrets.CODECOV_TOKEN }}" }
