# §16, Built-in table and trust keys — the calendar reminder this repository
# does not want to rely on a human keeping.
#
# `pnpm refresh --commit` (`scripts/refresh-table.mjs`) is the whole refresh: it
# verifies and rewrites every `default`, drops expired trust keys, stamps the
# sanctioned copies of those values (the two bootstrap installers, the unit
# suite's `default` literals) and commits exactly what it wrote. This job runs it
# weekly, proves the result passes `pnpm test`, and opens a PR — so what CI does
# and what a maintainer does locally are the same command.
#
# **It must not auto-merge**, and nothing here does: a bad `default` bricks every
# machine that has no recorded default of its own. Two things in the diff always
# need eyes — a bin path that moved needs a new `ranges` entry, and the line the
# run reports for node needs confirming against Node's LTS schedule (§02.3).
name: refresh-table
on:
  schedule:
    # Mondays, early UTC: a week is shorter than any release cadence in the
    # table, and a stale default costs a download, not a failure.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}
permissions: { contents: write, pull-requests: write }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Set up the pinned tools and install dependencies.
      - name: Setup jup
        uses: unjs/setup-jup@85aa1e9e4cd2995fba3bee414cde74bf88637a2c # v1.0.0

      - name: Refresh the table, trust store and stamped copies
        id: refresh
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # One long-lived branch, so a run that lands on an open PR updates it
          # instead of opening a second one nobody closes.
          git checkout -B chore/refresh-table
          before=$(git rev-parse HEAD)

          # `--commit` is the refresh: it writes the table, the trust store and
          # every stamped copy, then commits exactly those paths with the same
          # list of moved values it printed here.
          # `--silent`, so the log this PR quotes is the script's output alone.
          pnpm --silent run refresh --commit | tee refresh.log

          if [ "$before" = "$(git rev-parse HEAD)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The suite is what makes the rewrite reviewable rather than merely
      # plausible: the `default` literals in `test/unit/config.test.ts` were just
      # stamped, and every conformance fixture that tracks a default is resolved
      # from the table it rewrote.
      - if: steps.refresh.outputs.changed == 'true'
        run: pnpm test

      - name: Open the review PR
        if: steps.refresh.outputs.changed == 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          branch=chore/refresh-table
          git push --force origin "$branch"

          open=$(gh pr list --head "$branch" --state open --json number --jq '.[].number')
          if [ -n "$open" ]; then
            exit 0
          fi

          {
            echo 'Ran `pnpm refresh --commit` (§16, Built-in table and trust keys).'
            echo
            echo '```'
            cat refresh.log
            echo '```'
            echo
            echo '**Do not auto-merge.** Confirm the line node tracks against its LTS schedule'
            echo '(§02.3), and check whether anything here moved a bin path — that needs a new'
            echo '`ranges` entry, which this script cannot write.'
          } > pr-body.md

          gh pr create --head "$branch" \
            --title "chore: refresh the built-in table" \
            --body-file pr-body.md
