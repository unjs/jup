# Test the action with the published jup release.
name: setup-jup
on:
  push:
    paths: [action.yml, .github/fixtures/**, .github/workflows/setup-jup.yml]
  pull_request:
    paths: [action.yml, .github/fixtures/**, .github/workflows/setup-jup.yml]
  workflow_dispatch: {}
permissions: { contents: read }

jobs:
  # Test every manager on Linux and pnpm on each shim format.
  pinned:
    name: ${{ matrix.manager }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        manager: [npm, pnpm, yarn]
        include:
          - { os: windows-latest, manager: pnpm }
          - { os: macos-latest, manager: pnpm }
    steps:
      - uses: actions/checkout@v6
      - id: setup
        uses: ./
        with:
          working-directory: .github/fixtures/${{ matrix.manager }}
      - name: Check outputs, shims, and install
        shell: bash
        working-directory: .github/fixtures/${{ matrix.manager }}
        env:
          MANAGER: ${{ matrix.manager }}
          REPORTED: ${{ steps.setup.outputs.package-manager }}
          NODE_VERSION: ${{ steps.setup.outputs.node-version }}
          BIN: ${{ steps.setup.outputs.bin-directory }}
        run: |
          set -euo pipefail

          [ "$REPORTED" = "$MANAGER" ] ||
            { echo "::error::package-manager output was '$REPORTED', expected '$MANAGER'"; exit 1; }
          [ "$(node --version)" = "v$NODE_VERSION" ] ||
            { echo "::error::node --version disagrees with the node-version output '$NODE_VERSION'"; exit 1; }

          # Git Bash changes Windows path syntax, so compare directory names.
          resolved="$(command -v "$MANAGER")"
          case "$resolved" in
            *"$(basename "$BIN")"/*) ;;
            *) echo "::error::$MANAGER resolved to $resolved, outside the shim directory"; exit 1 ;;
          esac
          "$MANAGER" --version

          # Each supported install creates one of these paths.
          [ -e node_modules ] || [ -e .pnp.cjs ] ||
            { echo "::error::install left nothing behind"; exit 1; }

  # An unpinned project gets Node.js but no dependency install.
  unpinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unpinned"
          printf '%s\n' '{ "name": "unpinned", "private": true }' > "$RUNNER_TEMP/unpinned/package.json"
      - id: setup
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/unpinned
      - shell: bash
        env:
          REPORTED: ${{ steps.setup.outputs.package-manager }}
          NODE_VERSION: ${{ steps.setup.outputs.node-version }}
        run: |
          set -euo pipefail
          [ -z "$REPORTED" ] ||
            { echo "::error::package-manager output was '$REPORTED', expected nothing"; exit 1; }
          [ -n "$NODE_VERSION" ] ||
            { echo "::error::no node-version was reported"; exit 1; }
          [ ! -e "$RUNNER_TEMP/unpinned/node_modules" ] ||
            { echo "::error::an unpinned project was installed into"; exit 1; }
          node --version

  # A project `.nvmrc` overrides the action default.
  version-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime"
          printf '22.18.0\n' > "$RUNNER_TEMP/runtime/.nvmrc"
      - id: setup
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/runtime
          node-version: lts
      - shell: bash
        working-directory: ${{ runner.temp }}/runtime
        env:
          NODE_VERSION: ${{ steps.setup.outputs.node-version }}
        run: |
          set -euo pipefail
          [ "$NODE_VERSION" = 22.18.0 ] ||
            { echo "::error::node-version output was '$NODE_VERSION', expected the .nvmrc's 22.18.0"; exit 1; }
          [ "$(node --version)" = v22.18.0 ] ||
            { echo "::error::the .nvmrc did not win: $(node --version)"; exit 1; }

  # `install: false` skips dependency installation.
  no-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: setup
        uses: ./
        with:
          working-directory: .github/fixtures/pnpm
          install: false
      - shell: bash
        working-directory: .github/fixtures/pnpm
        env:
          REPORTED: ${{ steps.setup.outputs.package-manager }}
        run: |
          set -euo pipefail
          [ "$REPORTED" = pnpm ] ||
            { echo "::error::package-manager output was '$REPORTED', expected 'pnpm'"; exit 1; }
          [ ! -e node_modules ] ||
            { echo "::error::install: false installed anyway"; exit 1; }
          pnpm --version

  # `none` skips manager shims but still allows `jup install`.
  no-managers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: setup
        uses: ./
        with:
          working-directory: .github/fixtures/pnpm
          package-managers: none
      - shell: bash
        working-directory: .github/fixtures/pnpm
        env:
          BIN: ${{ steps.setup.outputs.bin-directory }}
        run: |
          set -euo pipefail
          [ -e "$BIN/node" ] ||
            { echo "::error::node was not shimmed"; exit 1; }
          [ ! -e "$BIN/pnpm" ] ||
            { echo "::error::pnpm was shimmed despite package-managers: none"; exit 1; }
          [ -e node_modules ] ||
            { echo "::error::install did not run without a manager shim"; exit 1; }

  # Test an explicit runtime with both caches disabled.
  requested-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/requested"
          printf '%s\n' '{ "name": "requested", "private": true }' > "$RUNNER_TEMP/requested/package.json"
      - id: setup
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/requested
          node-version: v22.18.0
          cache: false
          cache-dependencies: false
      - shell: bash
        working-directory: ${{ runner.temp }}/requested
        env:
          NODE_VERSION: ${{ steps.setup.outputs.node-version }}
          NODE_PATH_OUT: ${{ steps.setup.outputs.node-path }}
        run: |
          set -euo pipefail
          # The output omits the optional leading `v`.
          [ "$NODE_VERSION" = 22.18.0 ] ||
            { echo "::error::node-version output was '$NODE_VERSION', expected 22.18.0"; exit 1; }
          [ "$(node --version)" = v22.18.0 ] ||
            { echo "::error::the requested version did not take: $(node --version)"; exit 1; }
          [ -e "$NODE_PATH_OUT" ] ||
            { echo "::error::the node-path output does not exist: $NODE_PATH_OUT"; exit 1; }
