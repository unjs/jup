name: autofix.ci
on: { push: {}, pull_request: {} }
permissions: { contents: read }
jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # jup replaces `setup-node`, `corepack enable` and `pnpm install` in one
      # step: it installs the runtime, shims the pinned package manager, warms
      # both stores, and runs the manager's own install.
      - name: Setup jup
        uses: ./.github/actions/setup-jup
      - run: pnpm fmt
      - name: Push the formatting fixes
        uses: autofix-ci/action@7a166d7532b277f34e16238930461bf77f9d7ed8
        with: { commit-message: "chore: apply automated updates" }
