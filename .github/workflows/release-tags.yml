# Move short version tags to each stable release.
name: release-tags
on:
  push:
    tags: ["v*"]
permissions: { contents: write }

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Ignore invalid tags and prereleases.
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "$TAG is not a release tag; nothing to move."; exit 0 ;;
          esac
          case "$TAG" in
            *-* | *+*) echo "$TAG is a prerelease; nothing to move."; exit 0 ;;
          esac

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          major="${TAG%%.*}"
          minor="${TAG%.*}"
          for short in "$major" "$minor"; do
            git tag -f -a "$short" -m "$short is $TAG" "$GITHUB_SHA"
            git push -f origin "refs/tags/$short"
            echo "$short -> $TAG"
          done
