# Yarn makes an install immutable whenever `CI` is set, and this fixture ships an
# empty lockfile on purpose — its `yarn.lock` is there to mark a project
# boundary, not to record resolutions. Committing a real one would mean keeping
# it in step with whichever Yarn 4 the `^4` pin resolves to that week, which is
# not what this project is here to test.
enableImmutableInstalls: false
